# ALBart Configuration
# Spotify credentials must be set as environment variables:
#   SPOTIPY_CLIENT_ID
#   SPOTIPY_CLIENT_SECRET
#   SPOTIPY_REDIRECT_URI  (default: http://localhost:8888/callback)

pipeline:
  art_source_size: 300      # pixel width of source art to request from Spotify
  norm_target: 0.12         # RMS normalization target for the norm FAISS index path

runtime:
  # Embedding
  embedding_interval_seconds: 10  # seconds between embeddings
  buffer_length_seconds: 30
  embedding_alpha: 1.0            # EMA weight; 1.0 = no smoothing (clean digital signal)

  # Single-index lookup (norm FAISS, RMS-normalized to 0.12)
  norm_target_raw: 0.12   # RMS norm applied before CLAP (matches pipeline norm path)

  # Sampling
  sampling_top_n: 20    # top-N candidates for alias table
  sampling_rank_decay: 0.85  # weight decay per rank step (rank 1=1.0, rank 2=0.85, …)

  # Dwell time (absolute, per-track)
  # Calibrated for clean digital signal (BlackHole): d_min_raw ~0.07–0.09 on good matches.
  # d=0.079 → ~8s; d=0.10 → ~4.7s; d=0.15 → floors at 1s.
  dwell_k: 25.0         # decay rate above floor; higher = steeper falloff
  dwell_floor: 0.07     # distances below this get full max_dwell
  min_dwell_seconds: 1.0
  max_dwell_seconds: 10.0

  # Brightness (driven by nearest-neighbor distance)
  # d=0.079 → ~0.71; d=0.10 → ~0.33; d=0.12 → clipped to brightness_min (0.15).
  brightness_k: 25.0         # decay rate above the floor; higher = faster falloff
  brightness_floor: 0.07    # distances below this are treated as full brightness
  brightness_power: 1.5     # power applied after exp; >1 = steep falloff
  brightness_fade_seconds: 1.0
  brightness_min: 0.15       # floor brightness — keeps covers visible even with poor match

  # AGC (macOS only — adjusts system input volume to keep RMS near target)
  agc_enabled: true
  agc_target_rms: 0.20       # target RMS for audio buffer; match recording conditions
  agc_interval_seconds: 10.0 # how often to check and adjust (seconds)

  # Display
  crossfade_seconds: 1.0
  display_fps: 30
  display_mode: "sim"   # "sim" or "hub75"
  sim_scale: 22         # pixels per LED in sim mode (22 → 704px window, ~7.5" at 96dpi)

  # Map display broadcast (set to 0 to disable; run_map.py listens on this port)
  map_broadcast_port: 57001

neighborhood:
  k: 100                       # nearest neighbors used for PCA basis
  base_thumb_px: 144           # thumbnail size at foreground (z=0)
  focal_length: 0.55           # perspective focal; smaller = faster size falloff with depth
  z_near: 0.5                  # minimum z offset (prevents division issues)
  zoom: 5.0                    # zoom level; higher = fewer tracks visible (tune to taste)
  lerp_speed: 0.3              # position lerp speed (lower = slower, more contemplative)
  recompute_threshold: 0.50    # L2 distance from last projection embedding to count as "far"
  recompute_consecutive: 5     # how many consecutive "far" embeddings before reprojecting
  sphere_base_radius: 50       # sphere radius in pixels

umap:
  n_neighbors: 15       # UMAP neighborhood size — larger = more global structure
  min_dist: 0.1         # minimum distance between points — smaller = tighter clusters
  metric: cosine        # cosine or euclidean (cosine matches CLAP's contrastive objective)
